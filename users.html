<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width" , initial scale="1.0">

    <head>
        <title>Registration form</title>
    </head>

    <body>
        <header>
            <div style="text-align: center;"><div style="font-size: xx-large;"><h1>Registration Form:</h1></div><hr>
           
        </header>
  <div style="text-align: center;"> <b><form action="/submit-form" method="post">
    <label for="name">Name:</label>
<input type="text" id="name" name="name" required>
<br><br>
 <label for="contact">contact:</label>
<input type="number" id="contact" name="contact" required>
<br><br>
<label for="password">Password:</label>
<input type="password" id="password" name="password" required>
<br><br>
<div>Gender:</div>
<input type="radio" id="male" name="gender" value="male">
<label for="male">Male</label>
<input type="radio" id="female" name="gender" value="female">
<label for="female">Female</label>
<br><br>
   <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>
    <br><br>
    <label for="age">Age:</label>
    <input type="number" id="age" name="age" min="18" max="100" required>
    <br><br>
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" pattern="[A-Za-z]{3,10}" title="Username should be 3-10 letters long" required>
    <br><br>
<div>Interests:</div>
<input type="checkbox" id="video" name="interests" value="video">
<label for="video">video></label>
<input type="checkbox" id="music" name="interests" value="music">
<label for="music">Music</label>
<br><br>
<label for="country">Country:</label>
<select id="country" name="country">
    <option value="Kenya">Kenya</option>
    <option value="Tanzania">Tanzania</option>
    <option value="Ghana">Ghana</option>
    <option value="Uganda">Uganda</option>
</select>
<br><br>
<label for="expectations">expectations:</label>
<textarea id="expectations" name="expectations" rows="4" cols="50"></textarea>
<br><br>
<input type="submit" value="Submit">
<br><br>
<form action="/upload" method="post" enctype="multipart/form-data">
    <label for="file">Choose a file:</label>
    <input type="file" id="file" name="file">
    <input type="submit" value="Upload">
</form>
</form></b></div>
        
    </body>
</html>
